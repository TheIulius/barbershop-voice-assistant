# Render "Blueprint": describes the free web service. Secrets (sync: false) are typed into Render's dashboard, never stored here.
services:
  - type: web
    name: barbershop-voice-assistant
    runtime: python
    plan: free
    region: frankfurt            # closest to Georgia; change in the dashboard if Render offers no free instance there
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - { key: PYTHON_VERSION, value: 3.11.9 }
      - { key: PUBLIC_MODE, value: "1" }
      - { key: TRUST_PROXY, value: "1" }
      - { key: LLM_PROVIDER, value: gemini }
      - { key: GEMINI_MODEL, value: gemini-flash-lite-latest }
      - { key: CALENDAR_BACKEND, value: local }
      - { key: LOCK_LANGUAGE, value: "1" }
      - { key: DAILY_CALL_MINUTES, value: "90" }
      - { key: MAX_CONCURRENT_CALLS, value: "3" }
      - { key: MAX_CALL_SECONDS, value: "420" }
      - { key: LIVE_MAX_CALLS_10MIN, value: "8" }
      - { key: ARCHIVE_BRANCH, value: call-logs }
      - { key: ARCHIVE_REPO, sync: false }          # "owner/name" of a PRIVATE logs-only repository (optional)
      - { key: ARCHIVE_GITHUB_TOKEN, sync: false }  # fine-grained token limited to that repo, Contents: read & write
      - { key: PUBLIC_BASE_URL, value: "https://barbershop-voice-assistant.onrender.com" }   # must match the address typed into Twilio exactly
      - { key: TELEPHONY_LANG, value: ka }
      - { key: TWILIO_AUTH_TOKEN, sync: false }     # phone line stays OFF until this is set (Twilio console -> Account -> Auth Token)
      - { key: TELEPHONY_ALLOWED_TO, sync: false }  # optional: your Twilio number(s) in +E.164, comma separated; other numbers are refused
      - { key: GEMINI_API_KEY, sync: false }
      - { key: APP_PASSWORD_HASH, sync: false }
      - { key: SESSION_SECRET, sync: false }
