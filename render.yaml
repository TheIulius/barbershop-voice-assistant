# Render "Blueprint": describes the free web service. Secrets (sync: false) are typed into Render's dashboard, never stored here.
services:
  - type: web
    name: barbershop-voice-assistant
    runtime: python
    plan: free
    region: frankfurt            # closest to Georgia; change in the dashboard if Render offers no free instance there
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - { key: PYTHON_VERSION, value: 3.11.9 }
      - { key: PUBLIC_MODE, value: "1" }
      - { key: TRUST_PROXY, value: "1" }
      - { key: LLM_PROVIDER, value: gemini }
      - { key: GEMINI_MODEL, value: gemini-flash-lite-latest }
      - { key: GEMINI_LIVE_MODEL, value: gemini-3.8-live }
      - { key: CALENDAR_BACKEND, value: local }
      - { key: LOCK_LANGUAGE, value: "1" }
      - { key: DAILY_CALL_MINUTES, value: "60" }
      - { key: MAX_CONCURRENT_CALLS, value: "3" }
      - { key: MAX_CALL_SECONDS, value: "240" }
      - { key: LIVE_MAX_CALLS_10MIN, value: "8" }
      - { key: GEMINI_API_KEY, sync: false }
      - { key: APP_PASSWORD_HASH, sync: false }
      - { key: SESSION_SECRET, sync: false }
